<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Junior Ballers 254</title>
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5c28">
<meta name="robots" content="noindex, nofollow">
</head>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('assets/js/sw.js').catch(console.warn);
}
</script>
<body>

<!-- Nav is injected by Shell.injectNav() at boot — see assets/partials/nav.html -->

<div class="page-wrapper">
<div class="app">

  <!-- APP HEADER -->
  <div class="app-header">
    <div>
      <h1>JB254 Admin</h1>
      <p>Operational snapshot across every tournament</p>
    </div>
    <a href="index.html" class="btn sm ghost">Full tournament list →</a>
  </div>

  <!-- Not-an-admin notice — same gating pattern as courts.html/users.html -->
  <div class="empty-state" id="not-admin-notice" style="display:none;">
    <span class="empty-icon">🔒</span>
    This page is only available to tournament admins.
  </div>

  <div id="admin-body" style="display:none;">

    <div class="stats-row" id="admin-stats-row" style="margin-bottom:1.5rem;"></div>

    <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;">

      <div>
        <div class="round-label" style="margin-bottom:8px;">⚠️ Needs attention</div>
        <div id="admin-pending-list">
          <div class="empty-state" style="padding:1.5rem 0;">
            <span class="empty-icon">⏳</span>Loading…
          </div>
        </div>
      </div>

      <div>
        <div class="round-label" style="margin-bottom:8px;">📅 Today's games</div>
        <div id="admin-today-list">
          <div class="empty-state" style="padding:1.5rem 0;">
            <span class="empty-icon">⏳</span>Loading…
          </div>
        </div>
      </div>

      <div>
        <div class="round-label" style="margin-bottom:8px;">🏀 Recent results</div>
        <div id="admin-recent-list">
          <div class="empty-state" style="padding:1.5rem 0;">
            <span class="empty-icon">⏳</span>Loading…
          </div>
        </div>
      </div>

    </div>
  </div>

</div><!-- /.app -->
</div><!-- /.page-wrapper -->

<script src="assets/js/pocketbase.umd.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logger.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
