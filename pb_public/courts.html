<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courts — Junior Ballers 254</title>
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5c28">
<style>
  .courts-grid {
    display               : grid;
    grid-template-columns : repeat(auto-fit, minmax(220px, 1fr));
    gap                    : 12px;
    margin-top             : 1rem;
  }
  .court-column {
    background    : var(--bg-secondary);
    border        : 0.5px solid var(--border-light);
    border-radius : var(--radius-lg);
    padding       : 12px;
  }
  .court-column h3 {
    font-size     : 13px;
    font-weight   : 600;
    margin-bottom : 10px;
    display       : flex;
    justify-content: space-between;
    align-items   : center;
  }
  .court-match-tile {
    background    : var(--bg-primary);
    border        : 0.5px solid var(--border-light);
    border-radius : var(--radius-sm);
    padding       : 8px 10px;
    margin-bottom : 6px;
    font-size     : 12px;
  }
  .court-match-tile .teams { margin-bottom: 4px; }
  .court-match-tile select { width: 100%; font-size: 11px; }
</style>
</head>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('assets/js/sw.js').catch(console.warn);
}
</script>
<body>
 <nav class="app-nav" id="app-nav">
    <a href="index.html" class="nav-brand"><img src="assets/img/logo.png" alt="Junior Ballers 254" class="nav-logo"> JB254</a>
    <div class="app-nav-links">
      <a href="index.html" class="nav-link" id="nav-home">🏠 Home</a>
      <a href="stats.html" class="nav-link" id="nav-stats">📊 Stats</a>
      <a href="teams.html" class="nav-link" id="nav-teams">🏀 Teams</a>
      <a href="users.html" class="nav-link" id="nav-users" style="display:none;">👥 Users</a>
      <a href="courts.html" class="nav-link" id="nav-courts" style="display:none;">🏟️ Courts</a>
    </div>
    <div id="auth-controls"></div>
  </nav>

  <nav class="bottom-nav">
    <a href="index.html" class="bottom-nav-item"><span class="nav-icon">🏠</span>Home</a>
    <a href="stats.html" class="bottom-nav-item"><span class="nav-icon">📊</span>Stats</a>
    <a href="teams.html" class="bottom-nav-item"><span class="nav-icon">🏀</span> Teams</a>
    <a href="login.html" class="bottom-nav-item" id="bottom-nav-auth"><span class="nav-icon">👤</span>Account</a>
  </nav>

<div class="page-wrapper">
<div class="app">

  <div class="app-header">
    <div>
      <h1>Courts</h1>
      <p>Assign matches to courts — no fixed times yet, just queue order per court</p>
    </div>
  </div>

  <div class="empty-state" id="not-admin-notice" style="display:none;">
    <span class="empty-icon">🔒</span>
    This page is only available to tournament admins.
  </div>

  <div id="courts-page-body" style="display:none;">
    <div style="margin-bottom:1rem;">
      <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px;">Tournament</label>
      <select id="courts-tournament-picker" class="tournament-name-input" style="margin-bottom:0;" onchange="Courts.onTournamentChange()"></select>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;">
      <input type="text" id="new-venue-name" placeholder="Venue name, e.g. Main Gym" class="tournament-name-input" style="margin-bottom:0;flex:2;min-width:160px;" />
      <input type="number" id="new-venue-court-count" min="1" max="20" value="1" placeholder="Courts" class="tournament-name-input" style="margin-bottom:0;flex:0 0 90px;" />
      <button class="btn primary" onclick="Courts.addVenue()">+ Add venue</button>
    </div>

    <div class="error-banner" id="courts-error"><span id="courts-error-msg"></span></div>

    <div class="courts-grid" id="courts-grid"></div>
  </div>

</div>
</div>

<script src="assets/js/pocketbase.umd.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logger.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/courts.js"></script>
</body>
</html>
