<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament — Junior Ballers 254</title>
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5c28">
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Junior Ballers 254">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta name="twitter:card" content="summary">
</head>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('assets/js/sw.js').catch(console.warn);
}
</script>
<body>

<!-- Nav is injected by Shell.injectNav() at boot — see assets/partials/nav.html -->

<div class="page-wrapper">
<div class="app">

  <!-- APP HEADER -->
  <div class="app-header">
    <div>
      <div class="schedule-title" id="tourn-title">Loading…</div>
      <div class="schedule-meta" id="tourn-meta"></div>
    </div>
    <div class="app-header-right">
      <span class="status-badge badge-pending" id="tourn-status">—</span>
    </div>
  </div>

  <!-- Nav strip — Overview is this page; for a single category this also
       links to Bracket/Teams. For a multi-category event overview, this
       links out to each category instead (see tournament.js _renderNav /
       _renderEventNav). -->
  <div class="btn-row" id="tourn-nav" style="margin-bottom:1.25rem;"></div>

  <div class="error-banner" id="tourn-error">
    <span class="banner-icon">!</span>
    <span id="tourn-error-msg"></span>
  </div>

  <div id="tourn-body">

    <!-- Event-mode only — banner image (reuses the same banner_image field
         already used by tournament cards), hidden entirely in single-
         category mode. -->
    <div id="tourn-banner" class="tourn-banner-wrap" style="display:none;"></div>

    <div class="stats-row" id="tourn-stats-row"></div>

    <div style="display:grid;grid-template-columns:1fr;gap:1.5rem;margin-top:0.5rem;">

      <div>
        <div class="round-label" style="margin-bottom:8px;">Recent results</div>
        <div id="tourn-recent-results">
          <div class="empty-state" style="padding:1.5rem 0;">
            <span class="empty-icon">⏳</span>Loading…
          </div>
        </div>
      </div>

      <div>
        <div class="round-label" style="margin-bottom:8px;">Next up</div>
        <div id="tourn-next-up">
          <div class="empty-state" style="padding:1.5rem 0;">
            <span class="empty-icon">⏳</span>Loading…
          </div>
        </div>
      </div>

    </div>

    <!-- Event-mode only — per-category standings preview. Stays empty in
         single-category mode and if no category has a real result yet. -->
    <div id="tourn-standings-preview" style="margin-top:1.5rem;"></div>

    <!-- Event-mode only — the category chips that let a user drill down
         from the whole tournament into one category's full experience. -->
    <div id="tourn-categories-list" style="margin-top:1.5rem;"></div>

  </div>

</div><!-- /.app -->
</div><!-- /.page-wrapper -->

<script src="assets/js/pocketbase.umd.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logger.js"></script>
<script src="assets/js/generators.js"></script>
<script src="assets/js/events.js"></script>
<script src="assets/js/tournament.js"></script>
</body>
</html>
