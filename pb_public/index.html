<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior Ballers 254 | Tournament Manager</title>
<link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=3.2.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a5c28">
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Junior Ballers 254">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta name="twitter:card" content="summary">
</head>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('assets/js/sw.js').catch(console.warn);
}
</script>
<body>

<!-- Nav is injected by Shell.injectNav() at boot — see assets/partials/nav.html -->

<div class="page-wrapper">
<div class="app">

  <div class="app-header">
    <div>
      <h1>Junior Ballers 254</h1>
      <p>From MiniHoops to Rising Stars</p>
    </div>
    <div class="app-header-right">
      <span class="conn-dot" id="conn-dot"></span>
      <span class="conn-label" id="conn-label">Connecting...</span>
    </div>
  </div>

  <div class="hero-section hero-fade-in">
    <div class="hero-pretitle">JB254 TOURNAMENTS</div>
    <h2 class="hero-headline">Follow the Game.</h2>
    <p class="hero-subheadline">
      Fixtures, results, standings, and brackets from Junior Ballers competitions.
    </p>
    <div class="hero-ctas">
      <a href="tournaments.html" class="btn primary hero-cta-primary">Explore Tournaments</a>
    </div>
  </div>

  <div id="hero-featured-tournament" class="hero-fade-in"></div>
  <div id="other-active-tournaments" class="hero-fade-in"></div>
  <div id="upcoming-games-section" class="hero-fade-in"></div>
  <div id="latest-results-section" class="hero-fade-in"></div>
  <div id="standings-preview-section" class="hero-fade-in"></div>
  <div id="hero-stats-banner" class="hero-fade-in"></div>
  <div id="recent-champions-section" class="hero-fade-in"></div>

  <!-- Guest-only home: favourites (if signed in) + directory gateway.
       No admin toolbar, no authoring screens — those live in manage.html,
       reachable only via admin.html, never from this page. -->
  <div class="screen active" id="screen-home">

    <div class="section-heading-row">
      <p class="section-label" style="margin:0">Tournament Directory</p>
    </div>

    <div class="success-banner" id="home-success">
      <span class="banner-icon">✓</span>
      <span id="home-success-msg"></span>
    </div>
    <div class="error-banner" id="home-error">
      <span class="banner-icon">!</span>
      <span id="home-error-msg"></span>
    </div>

    <div class="tournament-list" id="tournament-list">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

</div><!-- /.app -->
</div><!-- /.page-wrapper -->

<script src="assets/js/pocketbase.umd.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/logger.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/events.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
