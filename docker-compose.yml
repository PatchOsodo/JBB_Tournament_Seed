services:
  jbb-tournaments:
    build: .
    image: jbb-tournaments:latest
    container_name: jbb-tournaments-seed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8090"   # port 8097 assumes Manager already holds 8090 — adjust if not
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - TZ=Africa/Nairobi

volumes:
  pb_data:
    name: jbb_tournament_seed_data
